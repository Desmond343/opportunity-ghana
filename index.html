<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Opportunity Ghana - Find Opportunities, Build Skills, Advance Your Career</title>
    <meta name="description" content="Discover verified jobs, scholarships, internships, grants, courses, and certifications across Ghana. Database-driven opportunity and career platform." />

    <!-- Ignore Vite HMR WebSocket connection errors in AI Studio iframe environment -->
    <script>
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket') || args[0].includes('ws:'))) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#006B3F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Opportunity Ghana" />
    <meta name="application-name" content="Opportunity Ghana" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#006B3F" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="Opportunity Ghana - Find Opportunities, Build Skills, Advance Your Career" />
    <meta property="og:description" content="Discover verified jobs, scholarships, internships, grants, courses, and certifications across Ghana. Database-driven opportunity and career platform." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Opportunity Ghana" />
    <meta name="twitter:description" content="Find opportunities. Build skills. Advance your career." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>

</html>
