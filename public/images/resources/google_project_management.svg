    <rect x="22" y="24" width="16" height="32" rx="4" fill="#818CF8"/>
    <rect x="42" y="24" width="16" height="22" rx="4" fill="#C4B5FD"/>
    <text x="110" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#A5B4FC" letter-spacing="2">GOOGLE CAREER CERTIFICATE • PMI CAPM QUALIFYING</text>
    <text x="110" y="66" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Google Project Management</text>
