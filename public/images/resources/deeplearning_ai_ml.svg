<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="60%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#031A29"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dl_bg)"/>
  <circle cx="700" cy="110" r="150" fill="#0284C7" opacity="0.12"/>
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="20" fill="#082F49" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Neural Network nodes -->
    <circle cx="28" cy="30" r="5" fill="#38BDF8"/>
    <circle cx="28" cy="50" r="5" fill="#38BDF8"/>
    <circle cx="52" cy="24" r="5" fill="#FCD116"/>
    <circle cx="52" cy="40" r="5" fill="#FCD116"/>
    <circle cx="52" cy="56" r="5" fill="#FCD116"/>
    <line x1="28" y1="30" x2="52" y2="24" stroke="#7DD3FC" stroke-width="1.5"/>
    <line x1="28" y1="30" x2="52" y2="40" stroke="#7DD3FC" stroke-width="1.5"/>
    <line x1="28" y1="50" x2="52" y2="40" stroke="#7DD3FC" stroke-width="1.5"/>
    <line x1="28" y1="50" x2="52" y2="56" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="110" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38BDF8" letter-spacing="2">DEEPLEARNING.AI & STANFORD ONLINE</text>
