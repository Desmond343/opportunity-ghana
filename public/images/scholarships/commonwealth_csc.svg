<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="csc_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48"/>
      <stop offset="50%" stop-color="#081A2F"/>
      <stop offset="100%" stop-color="#030C16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#csc_bg)"/>
  <circle cx="720" cy="80" r="140" fill="#00A3E0" opacity="0.1"/>
  
  <!-- Emblem Badge -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="#005A9C"/>
    <circle cx="40" cy="40" r="24" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M40 20 A20 20 0 0 1 56 30 M40 20 A20 20 0 0 0 24 30" stroke="#FFD100" stroke-width="3" fill="none"/>
    <circle cx="40" cy="40" r="8" fill="#FFD100"/>
  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38BDF8" letter-spacing="2">COMMONWEALTH SCHOLARSHIP COMMISSION</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">United Kingdom Government Funding (FCDO)</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Commonwealth Scholarships</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Fully Funded Master's &amp; PhD Programs for Ghanaian Scholars</text>

  <g transform="translate(60, 290)">
    <rect width="250" height="44" rx="22" fill="#006B3F"/>
    <text x="24" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🇬🇭 Ghana Priority Nominations</text>
  </g>

  <g transform="translate(330, 290)">
    <rect width="230" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">Full Tuition + £1,347/mo</text>
  </g>

  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">Official Portal: cscuk.fcdo.gov.uk • In Partnership with Ghana Scholarships Secretariat</text>
</svg>
