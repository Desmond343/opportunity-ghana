<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="women-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A044E"/>
      <stop offset="50%" stop-color="#701A75"/>
      <stop offset="100%" stop-color="#1C031D"/>
    </linearGradient>
    <linearGradient id="rose-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#women-bg)"/>

  <!-- Geometric sparkle waves -->
  <g opacity="0.1" stroke="#F472B6" stroke-width="1.5">
    <circle cx="710" cy="110" r="150" fill="none"/>
    <circle cx="710" cy="110" r="80" fill="none"/>
    <path d="M40 370 Q 240 280 440 370 T 840 370" fill="none"/>
  </g>

  <!-- Women Leadership Emblem -->
  <g transform="translate(60, 50)">
    <rect width="76" height="76" rx="20" fill="url(#rose-glow)" opacity="0.95"/>
    <polygon points="38,20 44,32 57,34 47,43 50,56 38,49 26,56 29,43 19,34 32,32" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="156" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FCD116" letter-spacing="2">WOMEN IN LEADERSHIP &amp; STEM</text>
  <text x="156" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#FBCFE8">Female Scholars, Engineers &amp; Tech Founders</text>

  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Women in Tech &amp; STEM Scholarship</text>
  <text x="60" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#FDF2F8">Empowering the Next Generation of Ghanaian Women Leaders</text>

  <!-- Badges -->
  <g transform="translate(60, 276)">
    <rect width="210" height="38" rx="19" fill="#BE185D" opacity="0.95"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">👩🏾‍💻 Female Leadership Grant</text>
  </g>
  <g transform="translate(286, 276)">
    <rect width="250" height="38" rx="19" fill="#FFFFFF" opacity="0.12"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✨ Full Tuition, Laptop &amp; Mentor</text>
  </g>

  <line x1="60" y1="355" x2="740" y2="355" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="60" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F472B6">Opportunity Ghana • Diversity &amp; Inclusion</text>
  <text x="560" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FCD116">Fully Funded Cohorts</text>
</svg>
