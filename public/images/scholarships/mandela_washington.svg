<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="yali_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#yali_bg)"/>
  <circle cx="700" cy="80" r="160" fill="#E11D48" opacity="0.15"/>

  <!-- YALI / US Flag Stars Emblem -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="#DC2626"/>
    <polygon points="40,22 45,36 60,36 48,46 52,60 40,50 28,60 32,46 20,36 35,36" fill="#FFFFFF"/>
  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F87171" letter-spacing="2">U.S. DEPARTMENT OF STATE • YALI</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">Bureau of Educational and Cultural Affairs &amp; IREX</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Mandela Washington Fellowship</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Young African Leaders Initiative (YALI) • USA Institutes</text>

  <g transform="translate(60, 290)">
    <rect width="250" height="44" rx="22" fill="#006B3F"/>
    <text x="24" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🇬🇭 Ghana Young Leaders 25-35</text>
  </g>

  <g transform="translate(330, 290)">
    <rect width="250" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#60A5FA">Fully Funded • Flights &amp; Stay</text>
  </g>

  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">Official Portal: mandelawashingtonfellowship.org • Business, Civic, &amp; Public Tracks</text>
</svg>
