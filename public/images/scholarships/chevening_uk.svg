<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00247D"/>
      <stop offset="60%" stop-color="#0B1A40"/>
      <stop offset="100%" stop-color="#04091A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="50" r="180" fill="#CF142B" opacity="0.15"/>
  <circle cx="100" cy="380" r="150" fill="#00247D" opacity="0.3"/>
  
  <!-- Crown / Emblem Badge -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="url(#gold)" opacity="0.95"/>
    <path d="M22 52 L22 36 L30 44 L40 28 L50 44 L58 36 L58 52 Z" fill="#00247D"/>
    <circle cx="22" cy="32" r="3" fill="#00247D"/>
    <circle cx="40" cy="24" r="3" fill="#00247D"/>
    <circle cx="58" cy="32" r="3" fill="#00247D"/>
  </g>

  <!-- Typography -->
  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">UK GOVERNMENT SCHOLARSHIP</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#93C5FD">Foreign, Commonwealth &amp; Development Office</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Chevening Scholarships</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#E2E8F0">Fully Funded One-Year Master's in the United Kingdom</text>

  <!-- Ghana Tag -->
  <g transform="translate(60, 290)">
    <rect width="260" height="44" rx="22" fill="#006B3F" opacity="0.9"/>
    <text x="24" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🇬🇭 Open to Ghanaian Citizens</text>
  </g>

  <!-- Deadline & Funding Pill -->
  <g transform="translate(340, 290)">
    <rect width="220" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116">Fully Funded • 2027/28</text>
  </g>

  <!-- Bottom Verification Bar -->
  <line x1="60" y1="380" x2="740" y2="380" stroke="#334155" stroke-width="1"/>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Official Portal: chevening.org/apply • Global Leadership Network</text>
</svg>
