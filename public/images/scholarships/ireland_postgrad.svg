<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ire_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3321"/>
      <stop offset="60%" stop-color="#081F14"/>
      <stop offset="100%" stop-color="#030A06"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ire_bg)"/>
  <circle cx="700" cy="80" r="160" fill="#16A34A" opacity="0.12"/>

  <!-- Harp / Ireland Emblem -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="#15803D"/>
    <path d="M30 25 C45 25 55 35 55 55 M35 25 L35 55 M42 30 L42 55 M49 38 L49 55" stroke="#FCD116" stroke-width="2.5" fill="none"/>
  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4ADE80" letter-spacing="2">GOVERNMENT OF IRELAND</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#DCFCE7">Research Ireland (Formerly Irish Research Council)</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Government of Ireland Postgraduate</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Fully Funded Research Master's and PhD Scholarships</text>

  <g transform="translate(60, 290)">
    <rect width="250" height="44" rx="22" fill="#006B3F"/>
    <text x="24" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🇬🇭 Ghanaian Scholars Eligible</text>
  </g>

  <g transform="translate(330, 290)">
    <rect width="250" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4ADE80">€22,000/yr + Fee Grants</text>
  </g>

  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">Official Portal: researchireland.ie • Department of Further and Higher Education, Research, Innovation and Science</text>
</svg>
