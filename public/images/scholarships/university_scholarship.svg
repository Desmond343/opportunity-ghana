<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="uni-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F0E26"/>
    </linearGradient>
    <linearGradient id="indigo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#uni-bg)"/>

  <!-- Academic Quadrangle / Library Facade motif -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <rect x="100" y="240" width="600" height="150" fill="none"/>
    <line x1="100" y1="240" x2="400" y2="170"/>
    <line x1="700" y1="240" x2="400" y2="170"/>
    <line x1="200" y1="240" x2="200" y2="390"/>
    <line x1="300" y1="240" x2="300" y2="390"/>
    <line x1="400" y1="240" x2="400" y2="390"/>
    <line x1="500" y1="240" x2="500" y2="390"/>
    <line x1="600" y1="240" x2="600" y2="390"/>
  </g>

  <!-- University Graduation Cap Emblem -->
  <g transform="translate(60, 50)">
    <rect width="76" height="76" rx="20" fill="url(#indigo-glow)" opacity="0.95"/>
    <!-- Mortarboard cap -->
    <polygon points="38,22 62,33 38,44 14,33" fill="#FFFFFF"/>
    <path d="M22 38 V50 C22 55, 54 55, 54 50 V38" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="62" y1="33" x2="62" y2="52" stroke="#FCD116" stroke-width="2.5"/>
    <circle cx="62" cy="54" r="3" fill="#FCD116"/>
  </g>

  <!-- Typography -->
  <text x="156" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FCD116" letter-spacing="2">UNIVERSITY &amp; CAMPUS SCHOLARSHIPS</text>
  <text x="156" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#C7D2FE">Undergraduate &amp; Postgraduate Degree Programs</text>

  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Higher Education &amp; Collegiate Aid</text>
  <text x="60" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#E0E7FF">Merit, Need-Based, and Faculty Scholarships Worldwide</text>

  <!-- Badges -->
  <g transform="translate(60, 276)">
    <rect width="210" height="38" rx="19" fill="#4F46E5" opacity="0.95"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🎓 Accredited Universities</text>
  </g>
  <g transform="translate(286, 276)">
    <rect width="250" height="38" rx="19" fill="#FFFFFF" opacity="0.12"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">📚 Direct Tuition &amp; Campus Fees</text>
  </g>

  <line x1="60" y1="355" x2="740" y2="355" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="60" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#A5B4FC">Opportunity Ghana • University Partnerships</text>
  <text x="560" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FCD116">Full &amp; Partial Tuition Aid</text>
</svg>
