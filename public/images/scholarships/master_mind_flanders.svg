<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-flanders" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="fl-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-flanders)"/>
  <circle cx="710" cy="80" r="180" fill="#FFE000" opacity="0.12"/>
  <circle cx="90" cy="380" r="140" fill="#0284C7" opacity="0.2"/>

  <!-- Flanders Lion / Academic Emblem -->
  <g transform="translate(60, 55)">
    <rect width="80" height="80" rx="20" fill="url(#fl-yellow)"/>
    <path d="M40 20 C48 20 54 26 54 34 C54 44 40 58 40 58 C40 58 26 44 26 34 C26 26 32 20 40 20 Z" fill="#0F172A"/>
    <circle cx="40" cy="34" r="6" fill="url(#fl-yellow)"/>
  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFE000" letter-spacing="2">GOVERNMENT OF FLANDERS • BELGIUM</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">Flemish Ministry of Education &amp; Training</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Master Mind Scholarships</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Prestigious Master's Grants across Flemish Universities in Belgium</text>

  <g transform="translate(60, 285)">
    <rect width="250" height="42" rx="21" fill="#006B3F" opacity="0.95"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇬🇭 Open to Ghanaian Scholars</text>
  </g>
  <g transform="translate(325, 285)">
    <rect width="270" height="42" rx="21" fill="#FFFFFF" opacity="0.15"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇧🇪 €10,225/Year Grant + Waiver</text>
  </g>

  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFE000">Official Portal: studyinflanders.be/scholarships</text>
  <text x="490" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">Source Verified via ScholarshipsAds</text>
