<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mtn-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-mtn)"/>
  <circle cx="710" cy="80" r="170" fill="#FFCC00" opacity="0.15"/>
  <circle cx="90" cy="380" r="140" fill="#0284C7" opacity="0.15"/>

  <!-- MTN Oval Emblem -->
  <g transform="translate(60, 55)">
    <ellipse cx="40" cy="40" rx="38" ry="26" fill="url(#mtn-yellow)"/>
    <text x="40" y="47" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">MTN</text>
  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFCC00" letter-spacing="2">MTN GHANA FOUNDATION</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">Youth &amp; Digital Skills Empowerment</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Bright Scholarship Scheme</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Tuition, Accommodation, Stipend &amp; Laptop for Public Tertiary Students</text>

  <g transform="translate(60, 285)">
