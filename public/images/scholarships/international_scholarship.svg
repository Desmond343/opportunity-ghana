<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="intl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022B42"/>
      <stop offset="50%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#021420"/>
    </linearGradient>
    <linearGradient id="sky-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#intl-bg)"/>

  <!-- Globe & Flight Arcs -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="680" cy="180" r="140" fill="none"/>
    <ellipse cx="680" cy="180" rx="140" ry="50" fill="none"/>
    <ellipse cx="680" cy="180" rx="50" ry="140" fill="none"/>
    <path d="M120 380 Q 400 120 680 180" fill="none" stroke-dasharray="6,6"/>
  </g>

  <!-- International Globe Emblem -->
  <g transform="translate(60, 50)">
    <rect width="76" height="76" rx="20" fill="url(#sky-glow)" opacity="0.95"/>
    <circle cx="38" cy="38" r="22" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <ellipse cx="38" cy="38" rx="22" ry="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="16" y1="38" x2="60" y2="38" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="38" y1="16" x2="38" y2="60" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="156" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FCD116" letter-spacing="2">INTERNATIONAL STUDY ABROAD</text>
  <text x="156" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#BAE6FD">Global Fellowships, Exchange &amp; Degree Mobility</text>

  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Global Education Opportunities</text>
  <text x="60" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#E0F2FE">Connecting Ghanaian Talents to Top International Institutions</text>

  <!-- Badges -->
  <g transform="translate(60, 276)">
    <rect width="210" height="38" rx="19" fill="#0284C7" opacity="0.95"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✈️ Flights, Visa &amp; Stipend</text>
  </g>
  <g transform="translate(286, 276)">
    <rect width="250" height="38" rx="19" fill="#FFFFFF" opacity="0.12"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🌍 UK, US, Europe &amp; Asia</text>
  </g>

  <line x1="60" y1="355" x2="740" y2="355" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="60" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#7DD3FC">Opportunity Ghana • Global Reach</text>
  <text x="560" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FCD116">Fully Funded Programs</text>
</svg>
