<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gsa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006B3F"/>
      <stop offset="60%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-gsa)"/>
  <circle cx="720" cy="80" r="180" fill="#FCD116" opacity="0.12"/>
  <circle cx="80" cy="380" r="140" fill="#CE1126" opacity="0.15"/>

  <!-- Ghana Emblem Star -->
  <g transform="translate(60, 55)">
    <rect width="80" height="80" rx="20" fill="url(#gold)" opacity="0.95"/>
    <path d="M40 16 L47 31 L63 33 L51 44 L54 60 L40 52 L26 60 L29 44 L17 33 L33 31 Z" fill="#000000"/>
  </g>

  <!-- Typography -->
  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">REPUBLIC OF GHANA • MINISTRY OF EDUCATION</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#A7F3D0">Ghana Scholarships Authority (GSA)</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Local Tertiary Scholarships</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Decentralized Tuition Support for All Ghanaian Districts</text>

  <!-- Tags -->
  <g transform="translate(60, 285)">
    <rect width="250" height="42" rx="21" fill="#FCD116" opacity="0.95"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#000000">🇬🇭 All 261 Ghanaian Districts</text>
  </g>

  <g transform="translate(325, 285)">
    <rect width="255" height="42" rx="21" fill="#FFFFFF" opacity="0.15"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🏛️ Public &amp; Accredited Tertiary</text>
  </g>

  <!-- Footer Info Strip -->
  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FCD116">Official Portal: apply.scholarships.gov.gh</text>
  <text x="520" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#A7F3D0">Tuition &amp; Academic Grant</text>
</svg>
