<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mcf_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="60%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mcf_bg)"/>
  <circle cx="700" cy="80" r="160" fill="#EB001B" opacity="0.1"/>
  <circle cx="740" cy="80" r="120" fill="#F79E1B" opacity="0.15"/>

  <!-- Mastercard Venn Emblem -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="#1E293B"/>
    <circle cx="32" cy="40" r="20" fill="#EB001B" opacity="0.9"/>
    <circle cx="48" cy="40" r="20" fill="#F79E1B" opacity="0.9"/>
  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F59E0B" letter-spacing="2">MASTERCARD FOUNDATION &amp; EDINBURGH</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">The University of Edinburgh • Scotland, UK</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Mastercard Foundation Scholars</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Comprehensive Master's Scholarships for African Transformative Leaders</text>

  <g transform="translate(60, 290)">
    <rect width="250" height="44" rx="22" fill="#006B3F"/>
    <text x="24" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🇬🇭 Ghanaian Scholars Priority</text>
  </g>

  <g transform="translate(330, 290)">
    <rect width="250" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F59E0B">100% Tuition + Living Costs</text>
  </g>

  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">Official Portal: ed.ac.uk/student-funding/mastercard-foundation • Full Mentorship &amp; Travel</text>
