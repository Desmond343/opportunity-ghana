<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ef_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002654"/>
      <stop offset="60%" stop-color="#00142C"/>
      <stop offset="100%" stop-color="#000711"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ef_bg)"/>
  <circle cx="700" cy="80" r="160" fill="#ED2939" opacity="0.12"/>

  <!-- French Tricolore / Eiffel Emblem -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="#1E293B"/>
    <rect x="18" y="20" width="14" height="40" fill="#002654"/>
    <rect x="33" y="20" width="14" height="40" fill="#FFFFFF"/>
    <rect x="48" y="20" width="14" height="40" fill="#ED2939"/>
  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="2">RÉPUBLIQUE FRANÇAISE • CAMPUS FRANCE</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">Ministry for Europe and Foreign Affairs</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Eiffel Excellence Scholarships</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Prestigious Master's &amp; PhD Grants at French Higher Education Institutions</text>

  <g transform="translate(60, 290)">
    <rect width="250" height="44" rx="22" fill="#006B3F"/>
    <text x="24" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🇬🇭 Ghanaian Applicants Eligible</text>
  </g>

  <g transform="translate(330, 290)">
    <rect width="250" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#60A5FA">€1,181–€1,700/mo + Airfare</text>
  </g>

  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">Official Portal: campusfrance.org/en/eiffel • Engineering, Sciences, Law, Economics &amp; Policy</text>
</svg>
