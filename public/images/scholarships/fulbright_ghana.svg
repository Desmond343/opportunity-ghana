      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="us-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-fulbright)"/>
  <circle cx="710" cy="80" r="180" fill="#2563EB" opacity="0.18"/>
  <circle cx="90" cy="380" r="140" fill="#DC2626" opacity="0.15"/>

  <!-- US Embassy / Fulbright Emblem -->
  <g transform="translate(60, 55)">
