      <stop offset="0%" stop-color="#2D1115"/>
      <stop offset="60%" stop-color="#190B0D"/>
      <stop offset="100%" stop-color="#0A0405"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#kh_bg)"/>
  <circle cx="700" cy="80" r="160" fill="#8C1515" opacity="0.2"/>

  <!-- Stanford Cardinal Emblem -->
  <g transform="translate(60, 60)">
