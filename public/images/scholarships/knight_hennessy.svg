  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCA5A5" letter-spacing="2">STANFORD UNIVERSITY • USA</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#FEE2E2">Knight-Hennessy Scholars Program</text>

