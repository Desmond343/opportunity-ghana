<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hungary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-hungary)"/>
  <circle cx="710" cy="80" r="180" fill="#FCD116" opacity="0.12"/>
  <circle cx="90" cy="380" r="140" fill="#15803D" opacity="0.2"/>

  <!-- Hungarian / Tempus Shield -->
  <g transform="translate(60, 55)">
    <rect width="80" height="80" rx="20" fill="url(#gold)" opacity="0.95"/>
    <rect x="20" y="24" width="40" height="10" fill="#CE2939"/>
    <rect x="20" y="35" width="40" height="10" fill="#FFFFFF"/>
    <rect x="20" y="46" width="40" height="10" fill="#477050"/>
  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">GOVERNMENT OF HUNGARY • TEMPUS PUBLIC FOUNDATION</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#A7F3D0">Ministry of Foreign Affairs &amp; Ghana Scholarships Authority</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Stipendium Hungaricum Scholarships</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Fully Funded Bachelor's, Master's &amp; PhD Degrees at Hungarian Universities</text>

  <g transform="translate(60, 285)">
    <rect width="250" height="42" rx="21" fill="#006B3F" opacity="0.95"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇬🇭 Ghana Bilateral Agreement</text>
  </g>
  <g transform="translate(325, 285)">
    <rect width="270" height="42" rx="21" fill="#FFFFFF" opacity="0.15"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇭🇺 Tuition-Free + Stipend + Housing</text>
  </g>

  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FCD116">Official Portal: apply.stipendiumhungaricum.hu</text>
  <text x="490" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#A7F3D0">Source Verified via ScholarshipsAds</text>
</svg>
