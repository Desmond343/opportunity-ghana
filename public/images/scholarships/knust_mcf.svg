<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-knust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="60%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="mcf-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EB001B"/>
      <stop offset="100%" stop-color="#FF5F00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-knust)"/>
  <circle cx="710" cy="80" r="180" fill="#FF5F00" opacity="0.15"/>
  <circle cx="90" cy="380" r="140" fill="#4C1D95" opacity="0.3"/>

  <!-- Mastercard Interlocking Circles -->
  <g transform="translate(60, 55)">
    <circle cx="28" cy="40" r="24" fill="#EB001B" opacity="0.95"/>
    <circle cx="52" cy="40" r="24" fill="#F79E1B" opacity="0.95"/>
  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">MASTERCARD FOUNDATION &amp; KNUST</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#DDD6FE">Kwame Nkrumah University of Science &amp; Technology</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">KNUST Mastercard Scholars Program</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Comprehensive Undergraduate Scholarships in Kumasi, Ghana</text>

  <g transform="translate(60, 285)">
    <rect width="250" height="42" rx="21" fill="#006B3F" opacity="0.95"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇬🇭 KNUST Campus, Kumasi</text>
  </g>
  <g transform="translate(325, 285)">
    <rect width="270" height="42" rx="21" fill="#FFFFFF" opacity="0.15"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✨ Tuition, Board, Laptop &amp; Stipend</text>
  </g>

  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FCD116">Official Portal: mcf.knust.edu.gh</text>
  <text x="490" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#DDD6FE">100% Comprehensive Financial Package</text>
