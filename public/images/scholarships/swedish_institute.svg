  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FECC00">Official Portal: si.se/en/apply/scholarships</text>
  <text x="490" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#BAE6FD">Source Verified via ScholarshipsAds</text>
