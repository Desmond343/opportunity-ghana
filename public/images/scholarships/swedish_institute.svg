<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sweden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006AA7"/>
      <stop offset="60%" stop-color="#004B75"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="sw-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECC00"/>
      <stop offset="100%" stop-color="#E5B800"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-sweden)"/>
  <circle cx="710" cy="80" r="180" fill="#FECC00" opacity="0.15"/>
  <circle cx="90" cy="380" r="140" fill="#006AA7" opacity="0.3"/>

  <!-- Swedish Cross Badge -->
  <g transform="translate(60, 55)">
