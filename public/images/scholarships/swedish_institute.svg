  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FECC00" letter-spacing="2">SWEDISH INSTITUTE • GOVERNMENT OF SWEDEN</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#BAE6FD">Ministry for Foreign Affairs of Sweden</text>

