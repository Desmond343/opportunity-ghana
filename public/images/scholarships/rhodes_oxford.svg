<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-oxford" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002147"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-oxford)"/>
  <circle cx="710" cy="80" r="180" fill="#002147" opacity="0.3"/>
  <circle cx="90" cy="380" r="140" fill="#D4AF37" opacity="0.15"/>

  <!-- Oxford Shield -->
  <g transform="translate(60, 55)">
    <rect width="80" height="80" rx="20" fill="url(#gold)" opacity="0.95"/>
    <path d="M25 24 L55 24 C55 45 40 58 40 58 C40 58 25 45 25 24 Z" fill="#002147"/>
    <path d="M32 30 L48 30 L48 42 L32 42 Z" fill="#FCD116"/>
  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">THE RHODES TRUST • UNIVERSITY OF OXFORD</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#BFDBFE">Rhodes House, Oxford, United Kingdom</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Rhodes Scholarship for West Africa</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Fully Funded Postgraduate Study at the University of Oxford</text>

  <g transform="translate(60, 285)">
    <rect width="250" height="42" rx="21" fill="#006B3F" opacity="0.95"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇬🇭 Ghana &amp; West Africa</text>
  </g>
  <g transform="translate(325, 285)">
    <rect width="270" height="42" rx="21" fill="#FFFFFF" opacity="0.15"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇬🇧 £20,400 Stipend + Oxford Fees</text>
  </g>

  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FCD116">Official Portal: rhodeshouse.ox.ac.uk/apply</text>
  <text x="510" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#BFDBFE">World's Premier Graduate Award</text>
</svg>
