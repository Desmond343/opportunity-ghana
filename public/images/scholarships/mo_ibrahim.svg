<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mo_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1A04"/>
      <stop offset="60%" stop-color="#190F02"/>
      <stop offset="100%" stop-color="#0A0601"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mo_bg)"/>
  <circle cx="700" cy="80" r="160" fill="#D97706" opacity="0.12"/>

  <!-- Mo Ibrahim Foundation Star / Shield -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="#D97706"/>
    <path d="M40 20 L58 30 L58 52 L40 62 L22 52 L22 30 Z" fill="#FFFFFF"/>
    <circle cx="40" cy="41" r="7" fill="#D97706"/>
  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FBBF24" letter-spacing="2">MO IBRAHIM FOUNDATION</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#FEF3C7">AfDB • UNECA • International Trade Centre (ITC)</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Ibrahim Leadership Fellowships</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Executive Leadership &amp; Governance Fellowship for African Professionals</text>

  <g transform="translate(60, 290)">
