    <path d="M25 25 H55 V55 H25 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M40 25 V55 M25 40 H55" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="5" fill="#FCD116"/>
  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F87171" letter-spacing="2">UNIVERSITY OF CAMBRIDGE</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">Gates Cambridge Trust • Bill &amp; Melinda Gates Foundation</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Gates Cambridge Scholarships</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Prestigious Full-Cost Postgraduate Awards (PhD &amp; Master's)</text>

