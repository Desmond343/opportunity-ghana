  </defs>
  <rect width="800" height="450" fill="url(#gc_bg)"/>
  <circle cx="700" cy="100" r="160" fill="#0072CE" opacity="0.12"/>

  <!-- Cambridge Crest Shape -->
  <g transform="translate(60, 60)">
