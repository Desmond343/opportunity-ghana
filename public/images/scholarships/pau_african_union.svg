    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✈️ Tuition, Living Stipend &amp; Airfare</text>
  </g>

  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FCD116">Official Portal: au-pau.org/submission</text>
  <text x="500" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#A7F3D0">Kenya, Nigeria, Cameroon, Algeria</text>
