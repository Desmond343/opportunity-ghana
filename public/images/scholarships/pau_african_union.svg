<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-pau)"/>
  <circle cx="710" cy="80" r="180" fill="#FCD116" opacity="0.12"/>
  <circle cx="90" cy="380" r="140" fill="#059669" opacity="0.2"/>

  <!-- African Union Continent Silhouette / Emblem -->
  <g transform="translate(60, 55)">
    <rect width="80" height="80" rx="20" fill="url(#gold)" opacity="0.95"/>
    <path d="M42 22 C46 22 52 24 54 28 C56 32 50 36 50 40 C50 44 56 46 54 50 C52 54 46 58 42 58 C38 58 34 50 32 46 C30 42 30 36 34 30 C38 24 38 22 42 22 Z" fill="#064E3B"/>
  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">AFRICAN UNION COMMISSION (AUC)</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#A7F3D0">Pan African University (PAU)</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Pan African University Scholarships</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Fully Funded Master's &amp; PhD Degrees across African Hubs</text>

