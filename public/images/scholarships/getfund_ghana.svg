    <path d="M40 22 L65 34 L40 46 L15 34 Z M60 42 L60 56 C60 56 52 64 40 64 C28 64 20 56 20 56 L20 42 L40 52 Z" fill="#1E3A8A"/>
  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">GHANA EDUCATION TRUST FUND</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#93C5FD">Government of Ghana Tertiary Education Support</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">GETFund Tertiary Scholarships</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Postgraduate &amp; Undergraduate Education Support Scheme</text>

  <g transform="translate(60, 285)">
