  </g>

  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FCD116">Official Portal: scholarship.getfund.gov.gh</text>
  <text x="510" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">Approved University Tuition Support</text>
