<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-getfund" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-getfund)"/>
  <circle cx="710" cy="80" r="180" fill="#FCD116" opacity="0.12"/>
  <circle cx="90" cy="380" r="140" fill="#3B82F6" opacity="0.18"/>

  <!-- Academic Cap / Pillar Icon -->
  <g transform="translate(60, 55)">
