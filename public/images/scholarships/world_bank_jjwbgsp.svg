  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FCD116">Official Portal: worldbank.org/scholarships</text>
  <text x="500" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#BAE6FD">JJ/WBGSP Participating Programs</text>
