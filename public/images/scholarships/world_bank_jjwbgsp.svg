  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">WORLD BANK GROUP &amp; GOVERNMENT OF JAPAN</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#BAE6FD">Development Economics &amp; International Cooperation</text>

