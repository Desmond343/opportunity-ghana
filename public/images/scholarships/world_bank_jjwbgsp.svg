<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-wb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-wb)"/>
  <circle cx="710" cy="80" r="180" fill="#0284C7" opacity="0.2"/>
  <circle cx="90" cy="380" r="140" fill="#FCD116" opacity="0.12"/>

  <!-- World Bank Globe / Nodes -->
  <g transform="translate(60, 55)">
