<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-singa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="60%" stop-color="#4C0519"/>
      <stop offset="100%" stop-color="#1F020A"/>
    </linearGradient>
    <linearGradient id="sg-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED2939"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-singa)"/>
  <circle cx="710" cy="80" r="180" fill="#ED2939" opacity="0.15"/>
  <circle cx="90" cy="380" r="140" fill="#BE123C" opacity="0.2"/>

  <!-- Singapore Crescent & Stars / A*STAR atom -->
  <g transform="translate(60, 55)">
    <rect width="80" height="80" rx="20" fill="url(#sg-red)"/>
    <circle cx="40" cy="40" r="8" fill="#FFFFFF"/>
    <ellipse cx="40" cy="40" rx="24" ry="9" fill="none" stroke="#FFFFFF" stroke-width="2" transform="rotate(30 40 40)"/>
    <ellipse cx="40" cy="40" rx="24" ry="9" fill="none" stroke="#FFFFFF" stroke-width="2" transform="rotate(-30 40 40)"/>
  </g>

  <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD116" letter-spacing="2">A*STAR • NUS • NTU • SUTD • SMU • SINGAPORE</text>
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#FECDD3">Agency for Science, Technology and Research (A*STAR)</text>

  <text x="60" y="205" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Singapore International Graduate Award</text>
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">Fully Funded PhD Research Scholarships in Science &amp; Engineering</text>

  <g transform="translate(60, 285)">
    <rect width="250" height="42" rx="21" fill="#006B3F" opacity="0.95"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇬🇭 Ghanaian STEM Graduates</text>
  </g>
  <g transform="translate(325, 285)">
    <rect width="270" height="42" rx="21" fill="#FFFFFF" opacity="0.15"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇸🇬 Tuition + S$3,200/Mo + Airfare</text>
  </g>

  <line x1="60" y1="365" x2="740" y2="365" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FCD116">Official Portal: a-star.edu.sg/singa</text>
  <text x="490" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FECDD3">Source Verified via ScholarshipsAds</text>
</svg>
