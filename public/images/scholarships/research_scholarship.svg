<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="res-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="50%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#14072B"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#res-bg)"/>

  <!-- Molecular / Constellation network -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="200" cy="120" r="6" fill="#C084FC"/>
    <circle cx="340" cy="80" r="4" fill="#C084FC"/>
    <circle cx="480" cy="140" r="5" fill="#C084FC"/>
    <circle cx="650" cy="100" r="7" fill="#C084FC"/>
    <line x1="200" y1="120" x2="340" y2="80"/>
    <line x1="340" y1="80" x2="480" y2="140"/>
    <line x1="480" y1="140" x2="650" y2="100"/>
  </g>

  <!-- Research Quill & Microscope Emblem -->
  <g transform="translate(60, 50)">
    <rect width="76" height="76" rx="20" fill="url(#purple-glow)" opacity="0.95"/>
    <circle cx="38" cy="30" r="12" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="47" y1="39" x2="56" y2="48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M22 52 H54" stroke="#FCD116" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="156" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FCD116" letter-spacing="2">POSTGRADUATE &amp; DOCTORAL RESEARCH</text>
  <text x="156" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#E9D5FF">PhD, Postdoc, Scientific &amp; Humanities Fellowships</text>

  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Doctoral &amp; Research Fellowships</text>
  <text x="60" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#F3E8FF">Funding Breakthrough African Scientific &amp; Academic Inquiries</text>

  <!-- Badges -->
  <g transform="translate(60, 276)">
    <rect width="210" height="38" rx="19" fill="#7E22CE" opacity="0.95"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🔬 Fully Funded Research</text>
  </g>
  <g transform="translate(286, 276)">
    <rect width="250" height="38" rx="19" fill="#FFFFFF" opacity="0.12"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">📑 Conference &amp; Lab Grants</text>
  </g>

  <line x1="60" y1="355" x2="740" y2="355" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="60" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#D8B4FE">Opportunity Ghana • Academic Innovation</text>
  <text x="560" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FCD116">Stipend &amp; Equipment Grants</text>
</svg>
