<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ch_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="60%" stop-color="#21070A"/>
      <stop offset="100%" stop-color="#0F0305"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ch_bg)"/>
  <circle cx="700" cy="80" r="160" fill="#FF0000" opacity="0.1"/>

  <!-- Swiss Cross Badge -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="#D52B1E"/>
    <rect x="33" y="18" width="14" height="44" fill="#FFFFFF"/>
    <rect x="18" y="33" width="44" height="14" fill="#FFFFFF"/>
  </g>

  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCA5A5" letter-spacing="2">SWISS CONFEDERATION • SERI</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">Federal Commission for Scholarships (FCS) &amp; Swiss Embassy Accra</text>

  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Swiss Government Excellence</text>
  <text x="60" y="250" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Doctoral (PhD), Postdoctoral &amp; Research Scholarships</text>

  <g transform="translate(60, 290)">
    <rect width="250" height="44" rx="22" fill="#006B3F"/>
    <text x="24" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🇬🇭 Ghanaian Researchers Eligible</text>
  </g>

  <g transform="translate(330, 290)">
    <rect width="250" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F87171">CHF 1,920–3,500/mo + Health</text>
  </g>

  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">Official Source: sbfi.admin.ch • Submission via Embassy of Switzerland in Accra</text>
</svg>
