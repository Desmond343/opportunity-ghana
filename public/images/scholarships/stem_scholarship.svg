<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E42"/>
      <stop offset="50%" stop-color="#0F2D59"/>
      <stop offset="100%" stop-color="#020D1A"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#stem-bg)"/>
  
  <!-- Subtle Circuitry / Tech Grid Lines -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1.5">
    <path d="M0 80 H240 L300 140 H500 L560 80 H800" fill="none"/>
    <path d="M0 360 H200 L260 300 H540 L600 360 H800" fill="none"/>
    <circle cx="240" cy="80" r="4" fill="#38BDF8"/>
    <circle cx="300" cy="140" r="4" fill="#38BDF8"/>
    <circle cx="500" cy="140" r="4" fill="#38BDF8"/>
    <circle cx="260" cy="300" r="4" fill="#38BDF8"/>
    <circle cx="540" cy="300" r="4" fill="#38BDF8"/>
    <circle cx="680" cy="220" r="140" fill="none" stroke-dasharray="6,6"/>
  </g>

  <!-- Glowing STEM Emblem -->
  <g transform="translate(60, 50)">
    <rect width="76" height="76" rx="20" fill="url(#cyan-glow)" opacity="0.95"/>
    <!-- Atom / Compass / Tech Icon -->
    <ellipse cx="38" cy="38" rx="24" ry="10" fill="none" stroke="#FFFFFF" stroke-width="2.5" transform="rotate(30 38 38)"/>
    <ellipse cx="38" cy="38" rx="24" ry="10" fill="none" stroke="#FFFFFF" stroke-width="2.5" transform="rotate(-30 38 38)"/>
    <circle cx="38" cy="38" r="5" fill="#FCD116"/>
  </g>

  <!-- Typography -->
  <text x="156" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FCD116" letter-spacing="2">STEM &amp; INNOVATION SCHOLARSHIP</text>
  <text x="156" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#93C5FD">Science, Technology, Engineering &amp; Mathematics</text>

  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">STEM Excellence &amp; Tech Leadership</text>
  <text x="60" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#CBD5E1">Empowering Ghanaian Scholars in Computing, AI &amp; Engineering</text>

  <!-- Badges / Highlights -->
  <g transform="translate(60, 276)">
    <rect width="230" height="38" rx="19" fill="#0284C7" opacity="0.9"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🔬 Laboratory &amp; Tech Cohort</text>
  </g>
  <g transform="translate(306, 276)">
    <rect width="250" height="38" rx="19" fill="#FFFFFF" opacity="0.12"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">⚡ Tuition Aid &amp; Research Stipend</text>
  </g>

  <line x1="60" y1="355" x2="740" y2="355" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="60" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Opportunity Ghana • Verified Academic Pathway</text>
  <text x="540" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FCD116">Merit &amp; Innovation Funding</text>
</svg>
