<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opportunity Ghana - Offline</title>
    <meta name="theme-color" content="#006B3F" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
        padding: 40px 28px;
        max-width: 440px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .icon-wrapper {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        overflow: hidden;
        margin-bottom: 24px;
        box-shadow: 0 4px 12px rgba(0, 107, 63, 0.15);
      }
      .icon-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: #fef3c7;
        color: #92400e;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 4px 12px;
        border-radius: 9999px;
        margin-bottom: 16px;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: #d97706;
        border-radius: 50%;
      }
      h1 {
        font-size: 26px;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 10px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #64748b;
        margin-bottom: 28px;
      }
      .btn-primary {
        background-color: #006B3F;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: 14px;
        padding: 14px 32px;
        width: 100%;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }
      .btn-primary:hover {
        background-color: #005331;
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .note {
        margin-top: 20px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrapper">
        <img src="/icon-192.png" alt="Opportunity Ghana" />
      </div>
      <div class="badge">
        <span class="pulse-dot"></span>
        No Internet Connection
      </div>
      <h1>You're offline</h1>
      <p>Reconnect to see the latest opportunities, scholarships, jobs, and career updates.</p>
      <button class="btn-primary" onclick="tryReconnect()">Try Again</button>
      <div class="note">
        Previously cached pages will load as soon as connection is restored.
      </div>
    </div>

    <script>
      function tryReconnect() {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          const btn = document.querySelector('.btn-primary');
          btn.textContent = 'Still offline — Retrying...';
          setTimeout(() => {
            btn.textContent = 'Try Again';
          }, 1500);
        }
      }

      window.addEventListener('online', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
